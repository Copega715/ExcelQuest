<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Excel Learning Path</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-low": "#f4f3f2",
                        "on-primary-container": "#ffffff",
                        "secondary": "#455b9d",
                        "inverse-primary": "#a3c9ff",
                        "on-primary-fixed-variant": "#004883",
                        "primary": "#005faa",
                        "on-error-container": "#93000a",
                        "on-surface": "#1a1c1c",
                        "outline": "#717783",
                        "on-tertiary-container": "#ffffff",
                        "surface-container": "#efeeed",
                        "tertiary-fixed": "#d5e4f3",
                        "secondary-container": "#a0b6fe",
                        "background": "#faf9f8",
                        "on-tertiary-fixed-variant": "#3a4854",
                        "inverse-surface": "#2f3130",
                        "on-secondary-container": "#2f4686",
                        "on-background": "#1a1c1c",
                        "on-primary-fixed": "#001c39",
                        "on-secondary-fixed-variant": "#2c4383",
                        "primary-fixed-dim": "#a3c9ff",
                        "on-secondary-fixed": "#00174b",
                        "primary-fixed": "#d3e3ff",
                        "error-container": "#ffdad6",
                        "inverse-on-surface": "#f1f0ef",
                        "secondary-fixed-dim": "#b4c5ff",
                        "surface-container-highest": "#e3e2e1",
                        "surface-container-high": "#e9e8e7",
                        "on-secondary": "#ffffff",
                        "surface-bright": "#faf9f8",
                        "error": "#ba1a1a",
                        "on-tertiary-fixed": "#0f1d28",
                        "on-primary": "#ffffff",
                        "surface-variant": "#e3e2e1",
                        "surface-container-lowest": "#ffffff",
                        "outline-variant": "#c0c7d4",
                        "on-surface-variant": "#404752",
                        "tertiary": "#515f6c",
                        "surface-dim": "#dadad9",
                        "primary-container": "#0078d4",
                        "surface": "#faf9f8",
                        "on-tertiary": "#ffffff",
                        "on-error": "#ffffff",
                        "tertiary-fixed-dim": "#b9c8d7",
                        "tertiary-container": "#6a7885",
                        "surface-tint": "#0060ab",
                        "secondary-fixed": "#dbe1ff"

                    "borderRadius": {
                        "DEFAULT": "0.25rem",

                        "xl": "0.75rem",
                        "full": "9999px"

                    "spacing": {
                        "container-max": "1200px",
                        "gutter": "20px",
                        "base": "4px",
                        "lg": "32px",

                        "xs": "8px",

                        "xl": "48px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Inter"],
                        "title-md": ["Inter"],

                    "fontSize": {

                        "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800"}],

                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "label-code": ["14px", {"lineHeight": "20px", "fontWeight": "500"}]

                }
            }
        }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .spreadsheet-grid {
            background-image: 
                linear-gradient(to right, #e3e2e1 1px, transparent 1px),
                linear-gradient(to bottom, #e3e2e1 1px, transparent 1px);
            background-size: 40px 24px;
        }

        @keyframes bounce-subtle {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.05); }
        }

        .active-node {
            animation: bounce-subtle 2s infinite ease-in-out;
        }

        .path-line {
            background: repeating-linear-gradient(
                to bottom,
                #c0c7d4,
                #c0c7d4 10px,
                transparent 10px,
                transparent 20px
            );
        }

        .tactile-button {
            box-shadow: 0 4px 0 0 rgba(0, 0, 0, 0.2);
            transition: all 0.1s ease;
        }
        .tactile-button:hover {
            transform: translateY(1px);
            box-shadow: 0 3px 0 0 rgba(0, 0, 0, 0.2);
        }
        .tactile-button:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 0 rgba(0, 0, 0, 0.2);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen pb-24">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-gutter h-16 bg-secondary dark:bg-surface-container-high transition-all duration-200">
<div class="flex items-center gap-4">
<button class="text-on-primary hover:bg-on-primary/10 p-2 rounded-full transition-all active:scale-95">
<span class="material-symbols-outlined">favorite</span>
</button>
<h1 class="text-on-primary font-extrabold text-title-md font-title-md">Excel Basics: Sums</h1>
</div>
<div class="flex items-center">
<span class="text-on-primary font-bold text-title-md">5 🔥</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="pt-24 px-gutter relative min-h-screen overflow-hidden">
<!-- Spreadsheet Grid Overlay Background -->
<div class="fixed inset-0 spreadsheet-grid opacity-20 pointer-events-none z-0"></div>
<div class="max-w-md mx-auto relative z-10 flex flex-col items-center">
<!-- Unit Header Card -->
<div class="w-full bg-primary-container text-on-primary-container p-md rounded-xl mb-xl relative overflow-hidden tactile-button">
<div class="relative z-10">
<p class="font-label-sm text-label-sm opacity-80 mb-base">UNIDAD 1</p>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile">Fundamentos de Celdas</h2>
<div class="mt-md flex items-center gap-xs">
<div class="flex-1 h-3 bg-on-primary-container/20 rounded-full overflow-hidden">
<div class="h-full bg-on-primary-container w-[40%] rounded-full"></div>
</div>
<span class="font-label-sm text-label-sm">40%</span>
</div>
</div>
<!-- Abstract Isometric Decoration -->
<div class="absolute -right-4 -bottom-4 opacity-20">
<span class="material-symbols-outlined text-[120px]" style="font-variation-settings: 'FILL' 1;">grid_view</span>
</div>
</div>
<!-- Learning Path Nodes -->
<div class="relative w-full flex flex-col items-center gap-12">
<!-- SVG Path Line (Duolingo Style) -->
<div class="absolute top-0 bottom-0 w-2 path-line z-0"></div>
<!-- Node 1: Completed -->
<div class="relative flex flex-col items-center z-10 transform -translate-x-12">
<div class="w-20 h-20 rounded-full bg-primary flex items-center justify-center tactile-button cursor-pointer">
<span class="material-symbols-outlined text-on-primary text-4xl" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<div class="bg-surface-container-high px-md py-xs rounded-full mt-xs shadow-sm">
<span class="font-label-sm text-label-sm text-on-surface">Intro</span>
</div>
</div>
<!-- Node 2: Completed -->
<div class="relative flex flex-col items-center z-10 transform translate-x-16">
<div class="w-20 h-20 rounded-full bg-primary flex items-center justify-center tactile-button cursor-pointer">
<span class="material-symbols-outlined text-on-primary text-4xl" style="font-variation-settings: 'FILL' 1;">calculate</span>
</div>
<div class="bg-surface-container-high px-md py-xs rounded-full mt-xs shadow-sm">
<span class="font-label-sm text-label-sm text-on-surface">Sumas</span>
</div>
</div>
<!-- Node 3: Current Active -->
<div class="relative flex flex-col items-center z-10 active-node">
<!-- Glow effect -->
<div class="absolute inset-0 bg-primary/20 blur-xl rounded-full"></div>
<div class="w-24 h-24 rounded-full bg-primary-container border-4 border-on-primary-container flex items-center justify-center tactile-button cursor-pointer">
<span class="material-symbols-outlined text-on-primary-container text-5xl" style="font-variation-settings: 'FILL' 1;">remove</span>
</div>
<div class="bg-primary text-on-primary px-md py-xs rounded-full mt-xs shadow-md border-2 border-white/20">
<span class="font-title-md text-title-md">Restas</span>
</div>
<!-- Tooltip pointer -->
<div class="mt-xs text-primary font-bold animate-pulse">¡EMPIEZA AQUÍ!</div>
</div>
<!-- Node 4: Locked -->
<div class="relative flex flex-col items-center z-10 transform -translate-x-14">
<div class="w-20 h-20 rounded-full bg-surface-dim flex items-center justify-center opacity-80 cursor-not-allowed">
<span class="material-symbols-outlined text-on-surface-variant text-4xl">lock</span>
</div>
<div class="bg-surface-container-high px-md py-xs rounded-full mt-xs shadow-sm opacity-60">
<span class="font-label-sm text-label-sm text-on-surface-variant">Formato</span>
</div>
</div>
<!-- Node 5: Locked -->
<div class="relative flex flex-col items-center z-10 transform translate-x-8">
<div class="w-20 h-20 rounded-full bg-surface-dim flex items-center justify-center opacity-80 cursor-not-allowed">
<span class="material-symbols-outlined text-on-surface-variant text-4xl">functions</span>
</div>
<div class="bg-surface-container-high px-md py-xs rounded-full mt-xs shadow-sm opacity-60">
<span class="font-label-sm text-label-sm text-on-surface-variant">Promedios</span>
</div>
</div>
<!-- Extra space for path ending visually -->
<div class="h-24"></div>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-20 bg-surface dark:bg-surface-container-lowest border-t-2 border-surface-container-highest dark:border-outline-variant">
<!-- Home (Active) -->
<a class="flex flex-col items-center justify-center text-primary dark:text-primary-fixed-dim font-bold transition-transform duration-100 active:translate-y-1 hover:bg-surface-container-low dark:hover:bg-surface-container px-4 py-2 rounded-lg" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">map</span>
<span class="text-label-sm font-label-sm">Home</span>
</a>
<!-- Leaders -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant transition-transform duration-100 active:translate-y-1 hover:bg-surface-container-low dark:hover:bg-surface-container px-4 py-2 rounded-lg" href="#">
<span class="material-symbols-outlined">leaderboard</span>
<span class="text-label-sm font-label-sm">Leaders</span>
</a>
<!-- Quests -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant transition-transform duration-100 active:translate-y-1 hover:bg-surface-container-low dark:hover:bg-surface-container px-4 py-2 rounded-lg" href="#">
<span class="material-symbols-outlined">task_alt</span>
<span class="text-label-sm font-label-sm">Quests</span>
</a>
<!-- Profile -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant transition-transform duration-100 active:translate-y-1 hover:bg-surface-container-low dark:hover:bg-surface-container px-4 py-2 rounded-lg" href="#">
<span class="material-symbols-outlined">person</span>
<span class="text-label-sm font-label-sm">Profile</span>
</a>
<!-- Shop -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant transition-transform duration-100 active:translate-y-1 hover:bg-surface-container-low dark:hover:bg-surface-container px-4 py-2 rounded-lg" href="#">
<span class="material-symbols-outlined">shopping_bag</span>
<span class="text-label-sm font-label-sm">Shop</span>
</a>
</nav>
<script>
        // Micro-interaction for the active node
        document.querySelector('.active-node').addEventListener('click', function() {
            this.style.transform = 'scale(0.95)';
            setTimeout(() => {
                this.style.transform = '';
                // In a real app, this would navigate to the lesson
                alert('Iniciando lección: Restas');
            }, 100);
        });
    </script>
</body></html>
